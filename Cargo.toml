[package]
name = "priv_tauri_updater"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.10.1"
futures-util = "0.3.31"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.52.3", features = ["sync"] }
warp = { version = "0.4.3", features = ["server"] }

[dev-dependencies]
tauri = "2.11.6"
tauri-plugin-updater = "2.12.0"
tokio = { version = "1.52.3", features = ["macros", "process", "rt"] }
